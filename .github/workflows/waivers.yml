name: Tuesday waiver wire & trades

# Posts waiver-wire adds/drops and trade ideas as a GitHub Issue, republishes the
# GitHub Pages site (both pages), and pings Discord — Tuesday, after Monday
# night football has settled the week and well before waivers process at 3:00am
# CT Wednesday. Can also be run on demand (Actions -> Run workflow) from the phone.
on:
  schedule:
    # Two Tuesday slots, placed by their WORST-CASE arrival: GitHub starts a
    # scheduled run when its queue allows, and this repo has measured delays
    # from 18 minutes to 8h01.
    #
    # 20:30 UTC = 3:30pm CDT / 2:30pm CST, after the writers' Tuesday pieces
    # (Richard's trade chart ~19:00 UTC, Eisenberg's waiver column ~20:40 UTC;
    # Boone's column is up Monday). Worst case 04:31 UTC = 11:31pm CDT, so it
    # still lands on Tuesday *in Central time* -- which is the date
    # season.is_rehearsal_window reads (season.central_today), and so the date
    # that decides the one preseason rehearsal. It also clears the 3:00am CT
    # Wednesday waiver run.
    #
    # 01:30 UTC Wednesday = Tuesday evening Central: the retry, for an article
    # that was not up yet at the first pass. It publishes only when it read a
    # writer the already-posted report didn't (workflow.py `news`, below), so a
    # normal week still produces exactly one post. Its worst case lands after
    # the waiver run, where it is merely late; and because it is gated on news,
    # its preseason firing cannot post a second rehearsal that adds nothing.
    - cron: "30 20 * * 2"
    - cron: "30 1 * * 3"
  workflow_dispatch:
    inputs:
      artifact_only:
        description: "Build both pages as run artifacts without production publishing"
        type: boolean
        default: false
      week:
        description: "NFL week (blank = auto-detect)"
        required: false
        default: ""
      rehearse:
        description: "Preseason dress rehearsal (score live data instead of refusing)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read        # unlike weekly-report.yml, this run writes no decision log
  issues: write
  pages: write
  id-token: write

# Shared with weekly-report.yml: a Pages deploy replaces the whole site, so the
# two workflows must queue rather than race — otherwise whichever finishes last
# publishes only its own pages and deletes the other's.
concurrency:
  group: ff-startsit-pages
  cancel-in-progress: false
  # Up to 100 waiting runs; order is when runs start waiting, not comment arrival.
  queue: max

jobs:
  waivers:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.artifact_only && 'publishing-test' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FF_ROSTER_SOURCE: espn
      # Same multi-league secret the weekly report uses. A Sleeper league is
      # declared here with its own source, e.g.
      # "work=espn:111111:3,dynasty=sleeper:999999:".
      FF_LEAGUES: ${{ secrets.FF_LEAGUES }}
      FF_LEAGUE_SCORING: ${{ vars.FF_LEAGUE_SCORING }}
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      # Required for any `sleeper` league — Sleeper resolves rosters by username.
      SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      # Repository *variable*, not a secret. These are the FantasyPros expert ids
      # for your preferred journalists (Boone / Eisenberg / Richard); their ranks
      # are what the waiver report scores adds against. See docs/SETUP.md.
      FF_PREFERRED_EXPERTS: ${{ vars.FF_PREFERRED_EXPERTS || secrets.FF_PREFERRED_EXPERTS }}
      FF_ANALYSTS: ${{ vars.FF_ANALYSTS }}
      FF_ECR_MIN_EXPERTS: ${{ vars.FF_ECR_MIN_EXPERTS }}
      FF_ANALYST_MIN_GAP: ${{ vars.FF_ANALYST_MIN_GAP }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ARTIFACT_ONLY: ${{ inputs.artifact_only || false }}
      INPUT_WEEK: ${{ github.event.inputs.week }}
      INPUT_REHEARSE: ${{ github.event.inputs.rehearse }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # Scheduled runs compare against what is already published this week, so
      # the Tuesday retry posts only when it read a writer the first pass
      # couldn't. The newest open waiver issue is enough: the report carries a
      # season/week marker, and an older week's issue simply isn't compared.
      - name: Fetch this week's published report (scheduled runs)
        if: ${{ github.event_name == 'schedule' && !inputs.artifact_only }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search 'in:title "waiver wire"' \
                --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue view "$NUM" --json body,comments \
              --jq '.body, (.comments[].body)' > previous.md
          fi

      # Note what is *not* here: the calibration-data restore/persist steps from
      # weekly-report.yml. The waiver pass is never written to the #7 results log
      # (see cli.cmd_waivers), so there is no log for this workflow to carry.
      - name: Waiver wire & trades
        run: |
          WEEK_ARGS=()
          if [ -n "$INPUT_WEEK" ]; then WEEK_ARGS=(--week "$INPUT_WEEK"); fi
          # Only the manual run can force a rehearsal. The scheduled run needs no
          # flag: build_bundle detects the pre-kickoff window itself, so exactly
          # one cron a season rehearses and the rest stay refusals.
          REHEARSE_ARGS=()
          if [ "$INPUT_REHEARSE" = "true" ]; then REHEARSE_ARGS=(--rehearse); fi
          # Manual runs always publish; scheduled ones only with something new.
          SINCE_ARGS=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then SINCE_ARGS=(--since previous.md); fi
          # Deterministic project Pages URL: Discord fires before the deploy step
          # below finishes, so the link can't come from the deploy's output.
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          WAIVERS_URL="https://${OWNER,,}.github.io/${REPO}/waivers.html"
          python -m ff_startsit.workflow run waivers "${WEEK_ARGS[@]}" "${REHEARSE_ARGS[@]}" "${SINCE_ARGS[@]}" --all-leagues --discord \
            --report waivers.md --dashboard ./site/waivers.html \
            --url "$WAIVERS_URL"
          cat waivers.md >> "$GITHUB_STEP_SUMMARY"

      # The same decision cmd_waivers made for Discord, for the steps below.
      - name: Anything new to publish?
        id: news
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python -m ff_startsit.workflow news waivers.md previous.md
          else
            echo "news=true" >> "$GITHUB_OUTPUT"
          fi

      # `identity` refuses a report whose season/week it cannot read, which is
      # the right answer for *which issue to post into* and the wrong one for
      # the run: this step sits before the Pages verify/deploy, has no output
      # anything else depends on, and the digest is already mirrored to the run
      # summary. Failing hard here would trade a missing comment for a missing
      # deploy. The start/sit workflow makes the same trade.
      - name: Post / update issue
        id: issue
        if: ${{ !inputs.artifact_only && steps.news.outputs.news == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -m ff_startsit.workflow identity waivers.md "waiver wire")
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" \
                --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            # A later run replaces the body with its full report (the issue
            # stays the week's one complete record; GitHub keeps the edit
            # history) and comments only what changed (workflow.update_note),
            # instead of re-posting the whole report as another comment.
            echo "Updating issue #$NUM"
            OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
            WAIVERS_URL="https://${OWNER,,}.github.io/${REPO}/waivers.html"
            gh issue view "$NUM" --json body,comments \
              --jq '.body, (.comments[].body)' > published.md
            python -m ff_startsit.workflow update-note waivers.md published.md \
              "$WAIVERS_URL" "Update" > update.md
            gh issue edit "$NUM" --body-file waivers.md
            gh issue comment "$NUM" --body-file update.md
          else
            echo "Creating issue: $TITLE"
            gh issue create --title "$TITLE" --body-file waivers.md
          fi

      - name: Report issue failure
        if: always() && steps.issue.outcome == 'failure'
        run: |
          echo "::warning title=Issue not posted::The waiver report was not posted or updated. The digest is in this run's summary; the site deploy below was unaffected."
          {
            echo "### Issue not posted"
            echo
            echo "The waiver report could not be posted to an issue — most likely its"
            echo "season/week identity could not be read, which \`identity\` refuses"
            echo "rather than guess at. The digest below is complete."
          } >> "$GITHUB_STEP_SUMMARY"

      # Carry the pages this run didn't build by copying their live copies
      # (workflow.restore_pages) instead of re-scoring the start/sit page. The
      # start/sit page is required, as it was when this step re-scored it;
      # values.html is optional, since Wednesday rebuilds it.
      - name: Keep the published start/sit and trade-values pages
        if: steps.news.outputs.news == 'true'
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          BASE="https://${OWNER,,}.github.io/${REPO}"
          python -m ff_startsit.workflow restore "$BASE" index.html
          python -m ff_startsit.workflow restore "$BASE" --optional values.html

      # A Pages deploy replaces the whole site, so uploading a directory that is
      # missing a page silently deletes that page from the live site. A failed
      # restore above is exactly how ./site ends up incomplete. Skipping the
      # deploy leaves the current site standing, which is strictly better than
      # replacing it with part of one.
      - name: Verify the site is complete
        id: site
        if: steps.news.outputs.news == 'true'
        run: |
          python -m ff_startsit.workflow site

      - name: Upload Pages artifact
        if: steps.site.outputs.complete == 'true' && !inputs.artifact_only
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: steps.site.outputs.complete == 'true' && !inputs.artifact_only
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload test artifacts
        if: inputs.artifact_only && steps.site.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: publishing-test
          path: |
            site/
            waivers.md
          retention-days: 7

      - name: Require complete test site
        if: inputs.artifact_only && steps.site.outputs.complete != 'true'
        run: exit 1
