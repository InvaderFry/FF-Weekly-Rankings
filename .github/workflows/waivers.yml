name: Tuesday waiver wire & trades

# Posts waiver-wire adds/drops and trade ideas as a GitHub Issue, republishes the
# GitHub Pages site (both pages), and pings Discord — Tuesday evening, after
# Monday night football has settled the week and before Wednesday-morning waivers
# process. Can also be run on demand (Actions -> Run workflow) from the phone.
on:
  schedule:
    # 00:00 UTC Wednesday = 7:00pm Tuesday CDT. GitHub cron has no daylight
    # saving, so from early November this lands at 6:00pm CST — still Tuesday
    # evening, still ahead of Wednesday's waiver run. Edit to taste.
    - cron: "0 0 * * 3"
  workflow_dispatch:
    inputs:
      artifact_only:
        description: "Build both pages as run artifacts without production publishing"
        type: boolean
        default: false
      week:
        description: "NFL week (blank = auto-detect)"
        required: false
        default: ""
      rehearse:
        description: "Preseason dress rehearsal (score live data instead of refusing)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read        # unlike weekly-report.yml, this run writes no decision log
  issues: write
  pages: write
  id-token: write

# Shared with weekly-report.yml: a Pages deploy replaces the whole site, so the
# two workflows must queue rather than race — otherwise whichever finishes last
# publishes only its own pages and deletes the other's.
concurrency:
  group: ff-startsit-pages
  cancel-in-progress: false
  # Up to 100 waiting runs; order is when runs start waiting, not comment arrival.
  queue: max

jobs:
  waivers:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.artifact_only && 'publishing-test' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FF_ROSTER_SOURCE: espn
      # Same multi-league secret the weekly report uses. A Sleeper league is
      # declared here with its own source, e.g.
      # "work=espn:111111:3,dynasty=sleeper:999999:".
      FF_LEAGUES: ${{ secrets.FF_LEAGUES }}
      FF_LEAGUE_SCORING: ${{ vars.FF_LEAGUE_SCORING }}
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      # Required for any `sleeper` league — Sleeper resolves rosters by username.
      SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      # Repository *variable*, not a secret. These are the FantasyPros expert ids
      # for your preferred journalists (Boone / Eisenberg / Richard); their ranks
      # are what the waiver report scores adds against. See docs/SETUP.md.
      FF_PREFERRED_EXPERTS: ${{ vars.FF_PREFERRED_EXPERTS || secrets.FF_PREFERRED_EXPERTS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ARTIFACT_ONLY: ${{ inputs.artifact_only || false }}
      INPUT_WEEK: ${{ github.event.inputs.week }}
      INPUT_REHEARSE: ${{ github.event.inputs.rehearse }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # Note what is *not* here: the calibration-data restore/persist steps from
      # weekly-report.yml. The waiver pass is never written to the #7 results log
      # (see cli.cmd_waivers), so there is no log for this workflow to carry.
      - name: Waiver wire & trades
        run: |
          WEEK_ARGS=()
          if [ -n "$INPUT_WEEK" ]; then WEEK_ARGS=(--week "$INPUT_WEEK"); fi
          # Only the manual run can force a rehearsal. The scheduled run needs no
          # flag: build_bundle detects the pre-kickoff window itself, so exactly
          # one cron a season rehearses and the rest stay refusals.
          REHEARSE_ARGS=()
          if [ "$INPUT_REHEARSE" = "true" ]; then REHEARSE_ARGS=(--rehearse); fi
          # Deterministic project Pages URL: Discord fires before the deploy step
          # below finishes, so the link can't come from the deploy's output.
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          WAIVERS_URL="https://${OWNER,,}.github.io/${REPO}/waivers.html"
          python -m ff_startsit.workflow run waivers "${WEEK_ARGS[@]}" "${REHEARSE_ARGS[@]}" --all-leagues --discord \
            --report waivers.md --dashboard ./site/waivers.html \
            --url "$WAIVERS_URL"
          cat waivers.md >> "$GITHUB_STEP_SUMMARY"

      # A Pages deploy replaces the entire site, so this run has to rebuild the
      # start/sit page too or deploying would delete it. No --log and no
      # --discord: Thursday/Sunday own the start/sit decisions and the ping.
      - name: Rebuild start/sit page (so the deploy doesn't drop it)
        continue-on-error: true
        run: |
          WEEK_ARGS=()
          if [ -n "$INPUT_WEEK" ]; then WEEK_ARGS=(--week "$INPUT_WEEK"); fi
          python -m ff_startsit.workflow run publish "${WEEK_ARGS[@]}" --all-leagues \
            --report report.md --dashboard ./site/index.html
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # `identity` refuses a report whose season/week it cannot read, which is
      # the right answer for *which issue to post into* and the wrong one for
      # the run: this step sits before the Pages verify/deploy, has no output
      # anything else depends on, and the digest is already mirrored to the run
      # summary. Failing hard here would trade a missing comment for a missing
      # deploy. The start/sit workflow makes the same trade.
      - name: Post / update issue
        id: issue
        if: ${{ !inputs.artifact_only }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -m ff_startsit.workflow identity waivers.md "waiver wire")
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" \
                --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            echo "Updating issue #$NUM"
            gh issue comment "$NUM" --body-file waivers.md
          else
            echo "Creating issue: $TITLE"
            gh issue create --title "$TITLE" --body-file waivers.md
          fi

      - name: Report issue failure
        if: always() && steps.issue.outcome == 'failure'
        run: |
          echo "::warning title=Issue not posted::The waiver report was not posted or updated. The digest is in this run's summary; the site deploy below was unaffected."
          {
            echo "### Issue not posted"
            echo
            echo "The waiver report could not be posted to an issue — most likely its"
            echo "season/week identity could not be read, which \`identity\` refuses"
            echo "rather than guess at. The digest below is complete."
          } >> "$GITHUB_STEP_SUMMARY"

      # A Pages deploy replaces the whole site, so uploading a directory that is
      # missing a page silently deletes that page from the live site. The sibling
      # rebuild above is `continue-on-error`, which is exactly how ./site ends up
      # incomplete. Skipping the deploy leaves the current site — both pages —
      # standing, which is strictly better than replacing it with half of one.
      - name: Verify the site is complete
        id: site
        run: |
          python -m ff_startsit.workflow site

      - name: Upload Pages artifact
        if: steps.site.outputs.complete == 'true' && !inputs.artifact_only
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: steps.site.outputs.complete == 'true' && !inputs.artifact_only
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload test artifacts
        if: inputs.artifact_only && steps.site.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: publishing-test
          path: |
            site/
            report.md
            waivers.md
          retention-days: 7

      - name: Require complete test site
        if: inputs.artifact_only && steps.site.outputs.complete != 'true'
        run: exit 1
