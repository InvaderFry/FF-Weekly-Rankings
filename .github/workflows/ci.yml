name: CI

# Runs the test suite on every push and pull request. The tests are fully
# offline (they exercise saved fixtures, not live APIs), so no secrets needed.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor pyproject declares; 3.13/3.14 are here because the
        # local dev venv runs 3.14, and a matrix that stops at 3.12 means a
        # green local suite proves nothing about the versions CI actually gates.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # actionlint 1.7.12 predates queue; validate that key before ignoring only
      # its unsupported-key diagnostic. All other actionlint errors still fail.
      - run: python scripts/check-workflows.py
      - run: actionlint -ignore 'unexpected key "queue" for "concurrency" section'

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build wheel
        run: pip wheel --no-deps --wheel-dir dist .
      - name: Test isolated installed distribution
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl pytest
          cp -R tests scripts "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c 'import ff_startsit; assert "site-packages" in ff_startsit.__file__'
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest tests
