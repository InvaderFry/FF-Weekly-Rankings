name: ChatOps start/sit

# Comment a slash command on any issue and the bot replies:
#   /lineup                    /report
#   /rank RB                   /rank WR week 5
#   /compare Josh Allen | Jalen Hurts
# Optional inline options on any command: week N, source espn|sleeper|manual, league ID, team ID.
# `source` only reaches a platform whose secrets are set — espn is what this repo
# has; sleeper and manual are parsed but error without their own config.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

# Serialize command execution and load per issue. Each runner has its own cache.
concurrency:
  group: chatops-${{ github.event.issue.number }}
  cancel-in-progress: false
  # Up to 100 waiting runs; order is when runs start waiting, not comment arrival.
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    # Only the repo owner can run commands, and only on slash-prefixed comments.
    if: >
      startsWith(github.event.comment.body, '/') &&
      github.event.comment.author_association == 'OWNER'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Run command
        env:
          # Pass the comment via env (never interpolated into the shell) to avoid injection.
          COMMENT_BODY: ${{ github.event.comment.body }}
          FF_ROSTER_SOURCE: espn
          # Must match weekly-report.yml: without FF_LEAGUES the documented
          # `/report league-name dynasty` form can only ever error, because
          # resolve_league sees nothing but the synthesized "default" profile.
          FF_LEAGUES: ${{ secrets.FF_LEAGUES }}
          FF_LEAGUE_SCORING: ${{ vars.FF_LEAGUE_SCORING }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          # Only needed for `source sleeper` — same conditional as the two
          # scheduled workflows. Passed through so the option works the moment
          # the secrets exist; unset (no Sleeper league this season) it errors
          # with "Sleeper user not found" rather than falling back to ESPN, so
          # don't read the option's presence in the header above as a promise
          # that it is configured.
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          # Repository variable (not secret) — powers /report's Preferred
          # journalists section; unset just omits it. See docs/SETUP.md.
          FF_PREFERRED_EXPERTS: ${{ vars.FF_PREFERRED_EXPERTS || secrets.FF_PREFERRED_EXPERTS }}
        run: |
          python -m ff_startsit.workflow chatops

      - name: Reply
        if: hashFiles('reply.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file reply.md
          # Acknowledge the triggering comment (best-effort).
          gh api -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='+1' >/dev/null 2>&1 || true
