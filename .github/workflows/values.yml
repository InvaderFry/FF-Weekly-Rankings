name: Wednesday trade values

# Posts each league's roster on Dave Richard's and Justin Boone's trade-value
# charts (with FantasyPros rest-of-season beside them) as a GitHub issue,
# publishes it to values.html on the Pages site, and sends the full tables to
# Discord. Richard's chart posts Tuesday; Boone's four charts post Wednesday
# afternoon. Can also be run on demand (Actions -> Run workflow), where a Boone
# chart URL can be passed if his pages don't link this week's yet.
on:
  schedule:
    # Placed by WORST-CASE arrival (this repo has measured GitHub delays of
    # 18 minutes to 8h01). 22:30 UTC = 4:30pm CST / 5:30pm CDT, after Boone's
    # charts (~21:15 UTC). The 02:30 UTC Thursday retry (Wednesday evening
    # Central) publishes only when it read a chart the first pass couldn't
    # (workflow.py `news`), so a normal week is one post.
    - cron: "30 22 * * 3"
    - cron: "30 2 * * 4"
  workflow_dispatch:
    inputs:
      artifact_only:
        description: "Build the page as a run artifact without production publishing"
        type: boolean
        default: false
      week:
        description: "NFL week (blank = auto-detect)"
        required: false
        default: ""
      boone_chart:
        description: "A Boone trade chart URL, if his pages don't link this week's yet"
        required: false
        default: ""

permissions:
  contents: read        # no decision log: nothing here is a start/sit decision
  issues: write
  pages: write
  id-token: write

# Shared with the other two workflows: a Pages deploy replaces the whole site,
# so deploys must queue rather than race.
concurrency:
  group: ff-startsit-pages
  cancel-in-progress: false
  queue: max

jobs:
  values:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.artifact_only && 'publishing-test' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FF_ROSTER_SOURCE: espn
      FF_LEAGUES: ${{ secrets.FF_LEAGUES }}
      FF_LEAGUE_SCORING: ${{ vars.FF_LEAGUE_SCORING }}
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      FF_ANALYSTS: ${{ vars.FF_ANALYSTS }}
      FF_ECR_MIN_EXPERTS: ${{ vars.FF_ECR_MIN_EXPERTS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ARTIFACT_ONLY: ${{ inputs.artifact_only || false }}
      INPUT_WEEK: ${{ github.event.inputs.week }}
      INPUT_BOONE_CHART: ${{ github.event.inputs.boone_chart }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # Same retry gate as waivers.yml: compare against what's already published.
      - name: Fetch this week's published values (scheduled runs)
        if: ${{ github.event_name == 'schedule' && !inputs.artifact_only }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search 'in:title "trade values"' \
                --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue view "$NUM" --json body,comments \
              --jq '.body, (.comments[].body)' > previous.md
          fi

      - name: Trade values
        run: |
          WEEK_ARGS=()
          if [ -n "$INPUT_WEEK" ]; then WEEK_ARGS=(--week "$INPUT_WEEK"); fi
          CHART_ARGS=()
          if [ -n "$INPUT_BOONE_CHART" ]; then CHART_ARGS=(--boone-chart "$INPUT_BOONE_CHART"); fi
          SINCE_ARGS=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then SINCE_ARGS=(--since previous.md); fi
          python -m ff_startsit.workflow run values "${WEEK_ARGS[@]}" "${CHART_ARGS[@]}" "${SINCE_ARGS[@]}" \
            --all-leagues --discord --report values.md --dashboard ./site/values.html
          cat values.md >> "$GITHUB_STEP_SUMMARY"

      - name: Anything new to publish?
        id: news
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python -m ff_startsit.workflow news values.md previous.md
          else
            echo "news=true" >> "$GITHUB_OUTPUT"
          fi

      # Wednesday also refreshes waivers.html: by now Boone's charts are up and
      # claims have processed, so the page shows who is still on the wire, who
      # was dropped, and your roster on both charts. The Odds API payload is
      # disk-cached for 30 minutes and the values step above just fetched it, so
      # this costs no extra credits. If it fails, the restore below keeps
      # Tuesday's page.
      #
      # Gated on its own record, not on the values report's news: a refresh that
      # failed on the first pass must still run on the retry, which may find no
      # new charts at all (workflow.refresh_needed).
      - name: Has this week's waivers refresh run?
        id: refresh_gate
        run: python -m ff_startsit.workflow refresh-needed values.md previous.md

      # Tuesday's published waiver report, for the "did the adds change?" check
      # below (its latest ff-adds marker is what this run compares with).
      - name: Fetch this week's published waiver report
        if: steps.news.outputs.news == 'true' || steps.refresh_gate.outputs.needed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search 'in:title "waiver wire"' \
                --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            echo "$NUM" > waiver-issue.txt
            gh issue view "$NUM" --json body,comments \
              --jq '.body, (.comments[].body)' > previous-waivers.md
          fi

      # Discord gets a short "Wednesday update" only when the claims themselves
      # changed since Tuesday's post (cmd_waivers --adds-changed-since); a
      # Wednesday that agrees with Tuesday stays quiet. A Boone chart URL given
      # to this run reaches this pass too, so the page and the veto read the
      # same charts the values page does.
      - name: Refresh the waivers page
        id: refresh
        if: steps.news.outputs.news == 'true' || steps.refresh_gate.outputs.needed == 'true'
        continue-on-error: true
        run: |
          WEEK_ARGS=()
          if [ -n "$INPUT_WEEK" ]; then WEEK_ARGS=(--week "$INPUT_WEEK"); fi
          CHART_ARGS=()
          if [ -n "$INPUT_BOONE_CHART" ]; then CHART_ARGS=(--boone-chart "$INPUT_BOONE_CHART"); fi
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          WAIVERS_URL="https://${OWNER,,}.github.io/${REPO}/waivers.html"
          python -m ff_startsit.workflow run waivers "${WEEK_ARGS[@]}" "${CHART_ARGS[@]}" \
            --all-leagues --report waivers.md --dashboard ./site/waivers.html \
            --discord --adds-changed-since previous-waivers.md --url "$WAIVERS_URL"

      # Recorded in the values report, so a retry knows the refresh is done.
      - name: Mark the waivers refresh done
        if: steps.refresh.outcome == 'success'
        run: python -m ff_startsit.workflow refreshed-marker values.md

      # Same decision as the Discord gate above. When it fired, record the
      # update on the waiver issue, so the 02:30 UTC retry compares with it
      # rather than with Tuesday's post and doesn't send the update twice.
      - name: Did the adds change?
        id: adds
        if: steps.refresh.outcome == 'success'
        run: python -m ff_startsit.workflow adds-changed waivers.md previous-waivers.md

      - name: Record the Wednesday update on the waiver issue
        if: ${{ !inputs.artifact_only && steps.adds.outputs.changed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f waiver-issue.txt ]; then
            { echo "**Wednesday update:** the adds changed since Tuesday's post."; echo; cat waivers.md; } > wednesday.md
            gh issue comment "$(cat waiver-issue.txt)" --body-file wednesday.md
          fi

      # The site deploys when the values report has news, or when a retry's
      # waivers refresh finally succeeded with nothing new on the charts.
      - name: Deploy the site?
        id: deploy_gate
        if: steps.news.outputs.news == 'true' || steps.refresh.outcome == 'success'
        run: echo "deploy=true" >> "$GITHUB_OUTPUT"

      # The start/sit page (and waivers.html, if the refresh above failed) is
      # copied from the live site rather than re-scored; if a page can't be
      # fetched, the deploy below is skipped and the live site stays as it is
      # (workflow.restore_pages / verify_site).
      - name: Keep the published start/sit and waiver pages
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          python -m ff_startsit.workflow restore "https://${OWNER,,}.github.io/${REPO}" index.html waivers.html

      - name: Post / update issue
        id: issue
        if: ${{ !inputs.artifact_only && steps.news.outputs.news == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -m ff_startsit.workflow identity values.md "trade values")
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" \
                --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            echo "Updating issue #$NUM"
            gh issue comment "$NUM" --body-file values.md
          else
            echo "Creating issue: $TITLE"
            gh issue create --title "$TITLE" --body-file values.md
          fi

      - name: Report issue failure
        if: always() && steps.issue.outcome == 'failure'
        run: |
          echo "::warning title=Issue not posted::The values report was not posted or updated. The digest is in this run's summary; the site deploy below was unaffected."

      - name: Verify the site is complete
        id: site
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: |
          python -m ff_startsit.workflow site

      - name: Upload Pages artifact
        if: steps.site.outputs.complete == 'true' && !inputs.artifact_only
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: steps.site.outputs.complete == 'true' && !inputs.artifact_only
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload test artifacts
        if: inputs.artifact_only && steps.site.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: publishing-test
          path: |
            site/
            values.md
          retention-days: 7

      - name: Require complete test site
        if: inputs.artifact_only && steps.site.outputs.complete != 'true'
        run: exit 1
