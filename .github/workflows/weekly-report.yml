name: Weekly start/sit report

# Posts your lineup + rankings as a GitHub Issue, publishes an HTML dashboard to
# GitHub Pages, and (if configured) pings Discord with the summary + dashboard link.
# Runs Thursday afternoon (before TNF) and Sunday morning (before the early games),
# and can be triggered manually from the GitHub mobile app (Actions -> Run workflow).
on:
  schedule:
    - cron: "0 21 * * 4"   # Thursday ~21:00 UTC (≈5pm ET EDT / 4pm EST)
    - cron: "0 13 * * 0"   # Sunday   ~13:00 UTC (≈9am ET EDT / 8am EST)
    - cron: "0 17 * 9 3"   # September Wednesdays, ahead of early season openers
  workflow_dispatch:
    inputs:
      artifact_only:
        description: "Build both pages as run artifacts without production publishing"
        type: boolean
        default: false
      week:
        description: "NFL week (blank = auto-detect)"
        required: false
        default: ""

permissions:
  contents: write       # append the decision log to the calibration-data branch
  issues: write
  pages: write          # publish the dashboard to GitHub Pages
  id-token: write       # required by actions/deploy-pages

# A manual run overlapping a scheduled one would race the Pages deployment and
# could file duplicate issues. Not cancelling in progress so a half-finished
# deploy is never left published.
#
# The group is shared with waivers.yml on purpose. Every Pages deploy replaces
# the *whole* site, so two workflows deploying concurrently would each publish
# only the pages it built and silently delete the other's. Both workflows emit
# the complete ./site (index.html + waivers.html) and this group makes their
# deploys queue instead of race.
concurrency:
  group: ff-startsit-pages
  cancel-in-progress: false
  # Up to 100 waiting runs; order is when runs start waiting, not comment arrival.
  queue: max

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.artifact_only && 'publishing-test' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FF_ROSTER_SOURCE: espn
      # Multi-league: a single secret lists every league, kept out of the public
      # repo. Format: "name=espn:LEAGUE_ID:TEAM_ID[:scoring]" comma-separated, e.g.
      # "work=espn:111111:3,dynasty=espn:222222:7:half". If unset, the flat
      # ESPN_LEAGUE_ID/ESPN_TEAM_ID below drive a single "default" league. The
      # ESPN cookies are per-account, so one pair covers all your ESPN leagues.
      FF_LEAGUES: ${{ secrets.FF_LEAGUES }}
      FF_LEAGUE_SCORING: ${{ vars.FF_LEAGUE_SCORING }}
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      # Only needed if one of your FF_LEAGUES entries uses source `sleeper`.
      SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      # Repository *variable* (Settings -> Secrets and variables -> Actions ->
      # Variables tab), not a secret: journalist ids aren't sensitive. Unset ->
      # the Preferred journalists section is simply omitted. See docs/SETUP.md.
      FF_PREFERRED_EXPERTS: ${{ vars.FF_PREFERRED_EXPERTS || secrets.FF_PREFERRED_EXPERTS }}
      FF_ANALYSTS: ${{ vars.FF_ANALYSTS }}
      FF_ANALYST_MIN_GAP: ${{ vars.FF_ANALYST_MIN_GAP }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ARTIFACT_ONLY: ${{ inputs.artifact_only || false }}
      INPUT_WEEK: ${{ github.event.inputs.week }}
      # Where the #7 decision log lives between runs (see "Restore decision log").
      LOG_BRANCH: calibration-data
      LOG_FILE: results_log.jsonl
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # The decision log is the corpus `calibrate` learns from, and a runner's
      # filesystem does not survive the job. Keep it on an orphan branch that
      # holds nothing else, so the log accumulates across scheduled runs instead
      # of starting empty every week.
      - name: Restore decision log
        run: |
          mkdir -p .cache
          if git fetch --depth=1 origin "$LOG_BRANCH" 2>/dev/null \
             && git show "FETCH_HEAD:$LOG_FILE" > .cache/results_log.jsonl 2>/dev/null; then
            echo "Restored $(wc -l < .cache/results_log.jsonl) logged decision(s)."
          else
            rm -f .cache/results_log.jsonl
            echo "No decision log on $LOG_BRANCH yet — starting a fresh one."
          fi

      - name: Publish (one scoring pass -> digest + dashboard + Discord)
        run: |
          WEEK_ARGS=()
          if [ -n "$INPUT_WEEK" ]; then WEEK_ARGS=(--week "$INPUT_WEEK"); fi
          # Deterministic project Pages URL so the Discord link is valid even
          # though the notification fires before the deploy step below completes.
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          DASH_URL="https://${OWNER,,}.github.io/${REPO}/"
          python -m ff_startsit.workflow run publish "${WEEK_ARGS[@]}" --all-leagues --log --discord \
            --report report.md --dashboard ./site/index.html \
            --url "$DASH_URL"
          # Mirror the digest to the run summary (viewable in the GitHub mobile app).
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # The site is deployed as a whole, so this run has to republish the
      # waivers page too or deploying would delete Tuesday's. No --discord and
      # no issue post: this is the page only, Tuesday owns the notification.
      - name: Rebuild waivers page (so the deploy doesn't drop it)
        continue-on-error: true
        run: |
          WEEK_ARGS=()
          if [ -n "$INPUT_WEEK" ]; then WEEK_ARGS=(--week "$INPUT_WEEK"); fi
          python -m ff_startsit.workflow run waivers "${WEEK_ARGS[@]}" --all-leagues \
            --report waivers.md --dashboard ./site/waivers.html
          cat waivers.md >> "$GITHUB_STEP_SUMMARY"

      # Best-effort: the digest, dashboard and Discord ping are what the user
      # actually depends on, so a push failure here warns rather than failing the
      # run — same trade the publish command makes for a Discord hiccup.
      # `concurrency` above is what keeps two runs from racing this branch.
      - name: Persist decision log
        id: persist
        if: ${{ !inputs.artifact_only }}
        continue-on-error: true
        run: |
          bash scripts/persist-decision-log.sh

      # Post the issue first so the core digest always lands, even if Pages/Discord
      # aren't configured yet.
      #
      # `identity` refuses a report whose season/week it cannot read, which is
      # the right answer for *which issue to post into* and the wrong one for
      # the run: this step sits before the Pages verify/deploy, has no output
      # anything else depends on, and the digest is already mirrored to the run
      # summary. Failing hard here would trade a missing comment for a missing
      # deploy. Same warn-and-continue trade as the decision log above.
      - name: Post / update issue
        id: issue
        if: ${{ !inputs.artifact_only }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -m ff_startsit.workflow identity report.md "start/sit")
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" \
                --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            echo "Updating issue #$NUM"
            gh issue comment "$NUM" --body-file report.md
          else
            echo "Creating issue: $TITLE"
            gh issue create --title "$TITLE" --body-file report.md
          fi

      - name: Report issue failure
        if: always() && steps.issue.outcome == 'failure'
        run: |
          echo "::warning title=Issue not posted::The start/sit digest was not posted or updated. The digest is in this run's summary; the site deploy below was unaffected."
          {
            echo "### Issue not posted"
            echo
            echo "The start/sit digest could not be posted to an issue — most likely its"
            echo "season/week identity could not be read, which \`identity\` refuses"
            echo "rather than guess at. The digest below is complete."
          } >> "$GITHUB_STEP_SUMMARY"

      # A Pages deploy replaces the whole site, so uploading a directory that is
      # missing a page silently deletes that page from the live site. The sibling
      # rebuild above is `continue-on-error`, which is exactly how ./site ends up
      # incomplete. Skipping the deploy leaves the current site — both pages —
      # standing, which is strictly better than replacing it with half of one.
      - name: Verify the site is complete
        id: site
        run: |
          python -m ff_startsit.workflow site

      - name: Upload Pages artifact
        if: steps.site.outputs.complete == 'true' && !inputs.artifact_only
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: steps.site.outputs.complete == 'true' && !inputs.artifact_only
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload test artifacts
        if: inputs.artifact_only && steps.site.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: publishing-test
          path: |
            site/
            report.md
            waivers.md
          retention-days: 7

      - name: Require complete test site
        if: inputs.artifact_only && steps.site.outputs.complete != 'true'
        run: exit 1

      - name: Report decision-log failure
        if: always() && steps.persist.outcome == 'failure'
        run: echo 'Decision-log persistence failed; new decisions were not saved to calibration-data.' >> "$GITHUB_STEP_SUMMARY"
