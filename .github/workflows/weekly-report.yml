name: Weekly start/sit report

# Posts your lineup + rankings as a GitHub Issue, publishes an HTML dashboard to
# GitHub Pages, and (if configured) pings Discord with the summary + dashboard link.
# Runs Thursday afternoon (before TNF) and Sunday morning (before the early games),
# and can be triggered manually from the GitHub mobile app (Actions -> Run workflow).
on:
  schedule:
    - cron: "0 21 * * 4"   # Thursday ~21:00 UTC (≈5pm ET EDT / 4pm EST)
    - cron: "0 13 * * 0"   # Sunday   ~13:00 UTC (≈9am ET EDT / 8am EST)
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (blank = auto-detect)"
        required: false
        default: ""

permissions:
  contents: write       # append the decision log to the calibration-data branch
  issues: write
  pages: write          # publish the dashboard to GitHub Pages
  id-token: write       # required by actions/deploy-pages

# A manual run overlapping a scheduled one would race the Pages deployment and
# could file duplicate issues. GitHub's Pages guidance calls for this group; not
# cancelling in progress so a half-finished deploy is never left published.
concurrency:
  group: weekly-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FF_ROSTER_SOURCE: espn
      # Multi-league: a single secret lists every league, kept out of the public
      # repo. Format: "name=espn:LEAGUE_ID:TEAM_ID[:scoring]" comma-separated, e.g.
      # "work=espn:111111:3,dynasty=espn:222222:7:half". If unset, the flat
      # ESPN_LEAGUE_ID/ESPN_TEAM_ID below drive a single "default" league. The
      # ESPN cookies are per-account, so one pair covers all your ESPN leagues.
      FF_LEAGUES: ${{ secrets.FF_LEAGUES }}
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      # Repository *variable* (Settings -> Secrets and variables -> Actions ->
      # Variables tab), not a secret: journalist ids aren't sensitive. Unset ->
      # the Preferred journalists section is simply omitted. See docs/SETUP.md.
      FF_PREFERRED_EXPERTS: ${{ vars.FF_PREFERRED_EXPERTS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      INPUT_WEEK: ${{ github.event.inputs.week }}
      # Where the #7 decision log lives between runs (see "Restore decision log").
      LOG_BRANCH: calibration-data
      LOG_FILE: results_log.jsonl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # The decision log is the corpus `calibrate` learns from, and a runner's
      # filesystem does not survive the job. Keep it on an orphan branch that
      # holds nothing else, so the log accumulates across scheduled runs instead
      # of starting empty every week.
      - name: Restore decision log
        run: |
          mkdir -p .cache
          if git fetch --depth=1 origin "$LOG_BRANCH" 2>/dev/null \
             && git show "FETCH_HEAD:$LOG_FILE" > .cache/results_log.jsonl 2>/dev/null; then
            echo "Restored $(wc -l < .cache/results_log.jsonl) logged decision(s)."
          else
            rm -f .cache/results_log.jsonl
            echo "No decision log on $LOG_BRANCH yet — starting a fresh one."
          fi

      - name: Publish (one scoring pass -> digest + dashboard + Discord)
        run: |
          WEEK_ARG=""
          if [ -n "$INPUT_WEEK" ]; then WEEK_ARG="--week $INPUT_WEEK"; fi
          # Deterministic project Pages URL so the Discord link is valid even
          # though the notification fires before the deploy step below completes.
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          DASH_URL="https://${OWNER,,}.github.io/${REPO}/"
          python -m ff_startsit publish $WEEK_ARG --all-leagues --log \
            --report report.md --dashboard ./site/index.html \
            --discord --url "$DASH_URL"
          # Mirror the digest to the run summary (viewable in the GitHub mobile app).
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # Best-effort: the digest, dashboard and Discord ping are what the user
      # actually depends on, so a push failure here warns rather than failing the
      # run — same trade the publish command makes for a Discord hiccup.
      # `concurrency` above is what keeps two runs from racing this branch.
      - name: Persist decision log
        continue-on-error: true
        run: |
          if [ ! -s .cache/results_log.jsonl ]; then
            echo "Nothing logged this run (preseason, or a signal served the wrong week) — leaving $LOG_BRANCH alone."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORKTREE="$(mktemp -d)"
          if git fetch --depth=1 origin "$LOG_BRANCH" 2>/dev/null; then
            git worktree add --detach "$WORKTREE" FETCH_HEAD
            git -C "$WORKTREE" checkout -B "$LOG_BRANCH"
          else
            git worktree add --detach "$WORKTREE"
            git -C "$WORKTREE" checkout --orphan "$LOG_BRANCH"
            git -C "$WORKTREE" rm -rf --quiet . || true
          fi
          cp .cache/results_log.jsonl "$WORKTREE/$LOG_FILE"
          # -f is required: results_log.jsonl is gitignored as cache everywhere
          # else in this repo, so a plain `git add` would silently do nothing and
          # the log would never actually persist.
          git -C "$WORKTREE" add -f "$LOG_FILE"
          if git -C "$WORKTREE" diff --cached --quiet; then
            echo "Log unchanged; nothing to push."
          else
            git -C "$WORKTREE" commit -m "Log week $(date -u +%Y-%m-%d) decisions"
            git -C "$WORKTREE" push origin "$LOG_BRANCH"
            echo "Pushed $(wc -l < .cache/results_log.jsonl) decision(s) to $LOG_BRANCH."
          fi

      # Post the issue first so the core digest always lands, even if Pages/Discord
      # aren't configured yet.
      - name: Post / update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WEEK=$(grep -oE 'Week [0-9]+' report.md | head -1 | grep -oE '[0-9]+' || true)
          TITLE="Week ${WEEK:-?} start/sit"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" \
                --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            echo "Updating issue #$NUM"
            gh issue comment "$NUM" --body-file report.md
          else
            echo "Creating issue: $TITLE"
            gh issue create --title "$TITLE" --body-file report.md
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
